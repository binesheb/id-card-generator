name: Build Windows App

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tagVersion = '${{ github.ref_name }}'.Substring(1)
          if ($package.version -ne $tagVersion) {
            throw "Release tag $tagVersion does not match package.json version $($package.version)."
          }
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## $tagVersion$" -Quiet)) {
            throw "CHANGELOG.md does not contain a release entry for $tagVersion."
          }
          Write-Host "Validated release version $tagVersion"

      - name: Validate and smoke-test source
        run: npm test

      - name: Build Windows installer and portable app
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify build outputs
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem -Path dist -Filter '*-Setup.exe' -File)
          $portable = @(Get-ChildItem -Path dist -Filter '*-Portable.exe' -File)
          if ($setup.Count -ne 1) { throw "Expected exactly one Windows installer, found $($setup.Count)." }
          if ($portable.Count -ne 1) { throw "Expected exactly one portable executable, found $($portable.Count)." }
          if ($setup[0].Length -lt 1MB) { throw "Installer is unexpectedly small." }
          if ($portable[0].Length -lt 1MB) { throw "Portable executable is unexpectedly small." }
          $latest = @(Get-ChildItem -Path dist -Filter 'latest*.yml' -File)
          if ($latest.Count -lt 1) { throw "Updater metadata latest*.yml was not generated." }
          Get-FileHash $setup[0].FullName -Algorithm SHA256
          Get-FileHash $portable[0].FullName -Algorithm SHA256
          Get-FileHash $latest[0].FullName -Algorithm SHA256
          Write-Host "Installer: $($setup[0].FullName) ($($setup[0].Length) bytes)"
          Write-Host "Portable:  $($portable[0].FullName) ($($portable[0].Length) bytes)"
          Write-Host "Updater metadata: $($latest[0].FullName)"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jayalakshmi-id-card-generator-windows
          path: |
            dist/*-Setup.exe
            dist/*-Portable.exe
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Jayalakshmi ID Card Generator ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*-Setup.exe
            dist/*-Portable.exe
            dist/latest*.yml
            dist/*.blockmap
