name: Build Windows App

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript
        run: npm run check

      - name: Build Windows installer and portable app
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify build outputs
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem -Path dist -Filter '*-Setup.exe' -File)
          $portable = @(Get-ChildItem -Path dist -Filter '*-Portable.exe' -File)
          if ($setup.Count -ne 1) { throw "Expected exactly one Windows installer, found $($setup.Count)." }
          if ($portable.Count -ne 1) { throw "Expected exactly one portable executable, found $($portable.Count)." }
          if ($setup[0].Length -lt 1MB) { throw "Installer is unexpectedly small." }
          if ($portable[0].Length -lt 1MB) { throw "Portable executable is unexpectedly small." }
          Get-FileHash $setup[0].FullName -Algorithm SHA256
          Get-FileHash $portable[0].FullName -Algorithm SHA256
          Write-Host "Installer: $($setup[0].FullName) ($($setup[0].Length) bytes)"
          Write-Host "Portable:  $($portable[0].FullName) ($($portable[0].Length) bytes)"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jayalakshmi-id-card-generator-windows
          path: |
            dist/*-Setup.exe
            dist/*-Portable.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*-Setup.exe
            dist/*-Portable.exe
